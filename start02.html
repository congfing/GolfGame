<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GOLF GAME</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: #000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  overflow: hidden;
}

/* ── スロット画像コンテナ ── */
.slot-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
}
.slot-img {
  width: 100%;
  height: 310px;
  object-fit: cover;
  object-position: center 22%;
  display: block;
}

/* ── リールオーバーレイ ── */
.reels-overlay {
  position: absolute;
  top: 6%; left: 9%; right: 9%; bottom: 14%;
  display: flex;
  gap: 2.2%;
  align-items: stretch;
}

/* ── 各リールビューポート ── */
.reel-vp {
  flex: 1;
  overflow: hidden;
  position: relative;
  border-radius: 4px;
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  box-shadow: inset 2px 0 6px rgba(0,0,0,0.5), inset -2px 0 6px rgba(0,0,0,0.5);
}
.reel-vp::before, .reel-vp::after {
  content: ''; position: absolute; left: 0; right: 0; z-index: 3; pointer-events: none;
}
.reel-vp::before { top: 0; height: 30%; background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%); }
.reel-vp::after  { bottom: 0; height: 30%; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%); }

.reel-track { position: absolute; left: 0; right: 0; will-change: transform; }

.reel-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: rgba(8,4,0,0.82);
  border-bottom: 1px solid rgba(80,50,0,0.4);
}
.ri-icon { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
.ri-name { font-size: 9px; font-weight: 900; color: #ffd700; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }

.reel-item.selected {
  background: rgba(18,6,0,0.88);
  box-shadow: inset 0 0 18px rgba(255,100,0,0.35), inset 0 0 6px rgba(255,200,0,0.2);
}
.reel-item.selected .ri-icon { filter: drop-shadow(0 0 8px rgba(255,120,0,0.9)) drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
.reel-item.selected .ri-name { color: #fff; text-shadow: 0 0 8px rgba(255,200,0,0.9); }

/* ── ボタンエリア全体 ── */
.start-area {
  width: 100%; max-width: 480px;
  background: linear-gradient(180deg, #1a0800 0%, #0a0300 100%);
  padding: 12px 16px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border-top: 1px solid rgba(200,150,0,0.25);
}

/* ── STOP ボタン（3つ横並び） ── */
.stop-row { display: flex; gap: 8px; width: 100%; max-width: 360px; }
.stop-btn {
  flex: 1; height: 42px; border-radius: 10px;
  font-size: 13px; font-weight: 900; letter-spacing: 0.1em;
  border: 2px solid rgba(80,60,0,0.35);
  background: linear-gradient(180deg, #2a1a00 0%, #140c00 100%);
  color: rgba(150,120,0,0.3);
  cursor: not-allowed; pointer-events: none;
  transition: all 0.2s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
}
.stop-btn.active {
  background: linear-gradient(180deg, #d06000 0%, #8a3a00 100%);
  border: 2px solid #f5c518;
  color: #fff;
  cursor: pointer; pointer-events: auto;
  box-shadow: 0 3px 14px rgba(200,80,0,0.6), 0 0 0 1px #c8960c, inset 0 1px 0 rgba(255,200,0,0.25);
  text-shadow: 0 0 8px rgba(255,150,0,0.8);
}
.stop-btn.active:active { transform: scale(0.93); }
.stop-btn.done {
  background: linear-gradient(180deg, #1a1200 0%, #0a0800 100%);
  border: 2px solid rgba(150,120,0,0.3);
  color: rgba(180,150,0,0.4);
  cursor: default; pointer-events: none;
}

/* ── START / SPIN ボタン ── */
.start-btn {
  width: 200px; height: 56px;
  border-radius: 28px;
  font-size: 20px; font-weight: 900; letter-spacing: 0.22em;
  cursor: pointer; pointer-events: auto;
  transition: all 0.3s;
  position: relative; overflow: hidden;
  /* 初期: SPINボタン */
  background: linear-gradient(180deg, #cc1a1a 0%, #8b0a0a 100%);
  border: 3px solid #f5c518;
  color: #ffd700;
  box-shadow: 0 4px 24px rgba(180,0,0,0.6), 0 0 0 1px #c8960c, inset 0 1px 0 rgba(255,220,0,0.3);
  text-shadow: 0 0 14px rgba(255,200,0,0.9), 0 1px 2px rgba(0,0,0,0.9);
}
.start-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(255,220,0,0.22) 0%, transparent 55%);
  border-radius: inherit; pointer-events: none;
}
.start-btn:active { transform: scale(0.95); }
.start-btn.dim {
  background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
  border: 3px solid rgba(100,80,30,0.35);
  color: rgba(150,130,60,0.35);
  cursor: not-allowed; pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.7);
  text-shadow: none;
}

@keyframes btnPulse {
  0%,100% { box-shadow: 0 4px 24px rgba(180,0,0,0.6), 0 0 0 1px #c8960c; }
  50%      { box-shadow: 0 4px 36px rgba(255,80,0,0.9), 0 0 26px rgba(255,200,0,0.6), 0 0 0 2px #ffd700; }
}
.start-btn.blink { animation: btnPulse 0.75s ease-in-out infinite; }

.start-hint { font-size: 11px; color: rgba(255,200,0,0.45); letter-spacing: 0.08em; transition: color 0.3s; }
.start-hint.lit { color: rgba(255,220,0,0.9); }

/* ── ダイレクトリンク ── */
.direct-links { display: flex; gap: 10px; }
.direct-links a { color: #ffd700; font-size: 12px; font-weight: 700; text-decoration: none; padding: 5px 12px; border: 1px solid rgba(200,150,0,0.45); border-radius: 8px; background: rgba(0,0,0,0.4); }
</style>
</head>
<body>

<!-- スロットマシン画像 + リールオーバーレイ -->
<div class="slot-wrap">
  <img class="slot-img" src="slot-bg.jpg" alt="slot machine" draggable="false">
  <div class="reels-overlay">
    <div class="reel-vp" id="rv0"><div class="reel-track" id="rt0"></div></div>
    <div class="reel-vp" id="rv1"><div class="reel-track" id="rt1"></div></div>
    <div class="reel-vp" id="rv2"><div class="reel-track" id="rt2"></div></div>
  </div>
</div>

<!-- ボタンエリア -->
<div class="start-area">
  <!-- STOP ボタン -->
  <div class="stop-row">
    <button class="stop-btn" id="sb0" onclick="doStop(0)">STOP</button>
    <button class="stop-btn" id="sb1" onclick="doStop(1)">STOP</button>
    <button class="stop-btn" id="sb2" onclick="doStop(2)">STOP</button>
  </div>
  <!-- SPIN / START ボタン -->
  <button class="start-btn" id="startBtn" onclick="doAction()">SPIN</button>
  <div class="start-hint lit" id="startHint">SPIN で回す！</div>
  <!-- ダイレクトリンク -->
  <div class="direct-links">
    <a href="index13.html?v=20260519home">v13</a>
    <a href="index_app08.html?v=20260519slide">v08</a>
    <a href="index_app11.html?v=20260519home">v11</a>
  </div>
</div>

<script>
/* ── ゲームデータ ── */
const ITEMS = [
  { name: 'v13', icon: '📋', url: 'index13.html?v=20260519home' },
  { name: 'v08', icon: '📱', url: 'index_app08.html?v=20260519slide' },
  { name: 'v11', icon: '🏌️', url: 'index_app11.html?v=20260519home' }
];
const N      = ITEMS.length;
const ALL    = [...ITEMS, ...ITEMS, ...ITEMS];
const SPIN_V = 900; // px/s

let gameState = 'idle'; // 'idle' | 'spinning' | 'done'

/* ────────────────────────────────────────
   Reel クラス（各リール独自の itemH/vport）
──────────────────────────────────────── */
class Reel {
  constructor(vpId, trackId, startIdx) {
    this.vp         = document.getElementById(vpId);
    this.track      = document.getElementById(trackId);
    this.startIdx   = startIdx;
    this.itemH      = 0;
    this.vport      = 0;
    this.pos        = 0;
    this.vel        = 0;
    this.animId     = null;
    this.dragging   = false;
    this.isSpinning = false;
  }

  init() {
    this.vport = this.vp.clientHeight || 248;
    this.itemH = this.vport / 3;
    this.pos   = (N + this.startIdx) * this.itemH;
    this._render();
    this._draw(false);
    this._bind();
  }

  sel() {
    if (!this.itemH) return 0;
    return ((Math.round(this.pos / this.itemH) % N) + N) % N;
  }

  _render() {
    this.track.innerHTML = ALL.map((it, i) =>
      `<div class="reel-item" data-i="${i}" style="height:${this.itemH}px;">
         <div class="ri-icon">${it.icon}</div>
         <div class="ri-name">${it.name}</div>
       </div>`
    ).join('');
  }

  _ty() { return this.vport / 2 - this.itemH / 2 - this.pos; }

  _draw(snap = false) {
    this.track.style.transition = snap
      ? 'transform 0.26s cubic-bezier(0.22,1,0.36,1)' : 'none';
    this.track.style.transform = `translateY(${this._ty()}px)`;
    const si = ((Math.round(this.pos / this.itemH)) % ALL.length + ALL.length) % ALL.length;
    this.track.querySelectorAll('.reel-item')
      .forEach((el, i) => el.classList.toggle('selected', i === si));
  }

  _wrap() {
    const lo = N * this.itemH, hi = N * 2 * this.itemH;
    if (this.pos >= hi) this.pos -= N * this.itemH;
    if (this.pos <  lo) this.pos += N * this.itemH;
  }

  _stopAnim() {
    if (this.animId) { cancelAnimationFrame(this.animId); this.animId = null; }
  }

  /* 連続回転 */
  spin() {
    this._stopAnim();
    this.isSpinning = true;
    let lastT = performance.now();
    const step = (now) => {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      this.pos += SPIN_V * dt;
      this._wrap();
      this._draw(false);
      this.animId = requestAnimationFrame(step);
    };
    this.animId = requestAnimationFrame(step);
  }

  /* STOP ボタンで停止 */
  stopSpin() {
    if (!this.isSpinning) return;
    this._stopAnim();
    this.isSpinning = false;
    this._decelerate(SPIN_V);
  }

  /* 減速 → スナップ */
  _decelerate(initVel) {
    this._stopAnim();
    this.vel = initVel;
    let lastT = performance.now();
    const step = (now) => {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      this.pos += this.vel * dt;
      this.vel *= Math.pow(0.92, dt * 60);
      this._wrap();
      this._draw(false);
      if (Math.abs(this.vel) > 18) {
        this.animId = requestAnimationFrame(step);
      } else {
        this.pos = Math.round(this.pos / this.itemH) * this.itemH;
        this._wrap();
        this._draw(true);
        this.vel = 0;
        this.animId = null;
        onReelSettled();
      }
    };
    this.animId = requestAnimationFrame(step);
  }

  _bind() {
    let startPos, startY, lastY, lastT, velSmooth;
    const canDrag = () => !this.isSpinning && gameState !== 'spinning';

    const onStart = (y) => {
      if (!canDrag()) return;
      this._stopAnim();
      startPos = this.pos; startY = lastY = y;
      lastT = performance.now(); velSmooth = 0;
      this.dragging = true;
    };
    const onMove = (y) => {
      if (!this.dragging) return;
      const now = performance.now(), dt = now - lastT;
      if (dt > 1) {
        const raw = -(y - lastY) / dt * 1000;
        velSmooth = velSmooth * 0.55 + raw * 0.45;
      }
      lastY = y; lastT = performance.now();
      this.pos = startPos + (startY - y);
      this._wrap(); this._draw(false);
    };
    const onEnd = () => {
      if (!this.dragging) return;
      this.dragging = false;
      this._decelerate(velSmooth);
    };

    this.vp.addEventListener('touchstart', e => { onStart(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    this.vp.addEventListener('touchmove',  e => { onMove(e.touches[0].clientY);  e.preventDefault(); }, { passive: false });
    this.vp.addEventListener('touchend',   () => onEnd(), { passive: true });
    let md = false;
    this.vp.addEventListener('mousedown', e => { md = true; onStart(e.clientY); e.preventDefault(); });
    window.addEventListener('mousemove',  e => { if (md) onMove(e.clientY); });
    window.addEventListener('mouseup',    () => { if (md) { md = false; onEnd(); } });
  }
}

/* ── リール生成 ── */
const reels = [
  new Reel('rv0','rt0', 0),
  new Reel('rv1','rt1', 0),
  new Reel('rv2','rt2', 0),
];

/* レイアウト確定後に初期化 */
window.addEventListener('load', () => {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      reels.forEach(r => r.init());
    });
  });
});

/* ── リール静止コールバック ── */
function onReelSettled() {
  if (gameState === 'spinning') {
    if (reels.every(r => !r.isSpinning && !r.animId)) {
      gameState = 'done';
      setStopBtns('done');
      refreshStartBtn();
    }
    return;
  }
  if (gameState === 'done') {
    if (reels.every(r => !r.animId && !r.dragging)) {
      refreshStartBtn();
    }
  }
}

/* ── STOP ボタン状態 ── */
function setStopBtns(mode) {
  for (let i = 0; i < 3; i++) {
    const b = document.getElementById('sb' + i);
    b.classList.remove('active','done');
    if (mode === 'active') b.classList.add('active');
    else if (mode === 'done') b.classList.add('done');
  }
}

/* ── START/SPIN ボタン更新 ── */
function refreshStartBtn() {
  const s   = reels.map(r => r.sel());
  const ok  = s[0] === s[1] && s[1] === s[2];
  const btn  = document.getElementById('startBtn');
  const hint = document.getElementById('startHint');

  btn.classList.remove('dim');
  if (ok) {
    btn.classList.add('blink');
    btn.textContent = 'START';
    hint.textContent = ITEMS[s[0]].name + ' でスタート！';
    hint.classList.add('lit');
  } else {
    btn.classList.remove('blink');
    btn.textContent = 'SPIN';
    hint.textContent = 'タッチで調整 → SPIN で再挑戦';
    hint.classList.remove('lit');
  }
}

/* ── SPIN/START ボタン押下 ── */
function doAction() {
  // START（揃っている） → 起動
  if (gameState === 'done') {
    const s = reels[0].sel();
    if (reels.every(r => r.sel() === s)) {
      window.location.href = ITEMS[s].url;
      return;
    }
  }
  // SPIN → 回転開始
  if (gameState === 'idle' || gameState === 'done') {
    gameState = 'spinning';
    reels.forEach(r => r.spin());
    setStopBtns('active');

    const btn  = document.getElementById('startBtn');
    const hint = document.getElementById('startHint');
    btn.classList.add('dim');
    btn.classList.remove('blink');
    btn.textContent = 'SPIN';
    hint.textContent = 'STOP で止めて！';
    hint.classList.remove('lit');
  }
}

/* ── 個別 STOP ── */
function doStop(idx) {
  if (gameState !== 'spinning') return;
  if (!reels[idx].isSpinning) return;
  reels[idx].stopSpin();
  document.getElementById('sb' + idx).classList.remove('active');
  document.getElementById('sb' + idx).classList.add('done');
}
</script>

<!-- 右スワイプ（左端から）でスタートへ戻る -->
<script>
(function(){
  var sx=0, sy=0;
  document.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(sx<40 && dx>70 && Math.abs(dy)<60){ window.location.href='start01.html'; }
  }, {passive:true});
})();
</script>
</body>
</html>
